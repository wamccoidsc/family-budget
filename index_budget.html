<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Family Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#20241f;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dcd6c8;
    --forest:#1f3a34;
    --forest-dim:#345048;
    --gold:#b8935f;
    --gold-dim:#e4d3b6;
    --red:#a8452f;
    --red-dim:#f3ddd6;
    --green-pos:#2f6b4f;
    --muted:#6b6558;
    --radius:4px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Auth screen ---------- */
  #authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 32px;
  }
  .auth-card .mark{
    font-family:'Source Serif 4',serif;
    font-size:14px;
    letter-spacing:0.04em;
    color:var(--gold);
    margin-bottom:6px;
  }
  .auth-card h1{font-size:28px;margin-bottom:4px;}
  .auth-card p.sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fdfcf9;
    font-size:14px;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--forest);outline-offset:1px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;
    border-radius:var(--radius);
    border:1px solid transparent;
    font-size:14px;font-weight:600;
    transition:background .12s ease;
  }
  .btn-primary{background:var(--forest);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--forest-dim);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:#efece2;}
  .btn-text{background:none;border:none;color:var(--forest);font-weight:600;padding:0;text-decoration:underline;font-size:13px;}
  .auth-toggle{margin-top:16px;font-size:13px;color:var(--muted);text-align:center;}
  .auth-error{background:var(--red-dim);color:var(--red);border-radius:var(--radius);padding:8px 10px;font-size:13px;margin-bottom:14px;display:none;}

  /* ---------- App shell ---------- */
  #appScreen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;
    background:var(--forest);
    color:#eef2ef;
    padding:26px 18px;
    display:flex;flex-direction:column;
  }
  .brand{font-family:'Source Serif 4',serif;font-size:20px;color:#fff;margin-bottom:2px;}
  .brand-sub{font-size:11px;color:var(--gold-dim);letter-spacing:.03em;margin-bottom:30px;}
  .nav-item{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;border-radius:var(--radius);
    color:#d7ded9;font-size:14px;font-weight:500;
    margin-bottom:4px;
    background:transparent;border:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.14);color:#fff;}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.14);}
  .userline{font-size:12px;color:var(--gold-dim);margin-bottom:10px;word-break:break-all;}
  .signout{font-size:13px;color:#d7ded9;background:none;border:none;padding:0;text-decoration:underline;}

  .main{flex:1;padding:30px 40px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:26px;}
  .month-switch{display:flex;align-items:center;gap:10px;}
  .month-switch button{background:none;border:1px solid var(--line);border-radius:var(--radius);width:30px;height:30px;font-size:15px;color:var(--forest);}
  .month-switch button:hover{background:#efece2;}
  .month-label{font-family:'Source Serif 4',serif;font-size:22px;min-width:190px;text-align:center;}

  .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .sum-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .sum-card .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .sum-card .val{font-family:'Source Serif 4',serif;font-size:24px;}
  .sum-card.pos .val{color:var(--green-pos);}
  .sum-card.neg .val{color:var(--red);}

  /* ---------- List view ---------- */
  .section-block{margin-bottom:26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;}
  .section-head h3{font-size:15px;text-transform:none;letter-spacing:.01em;}
  .section-head .sec-total{font-size:14px;color:var(--muted);font-family:'Source Serif 4',serif;}
  .item-row{
    display:grid;
    grid-template-columns:22px 1.4fr 1fr 100px 110px 90px 34px;
    align-items:center;gap:10px;
    padding:10px 6px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .who-tag{
    font-size:11px;font-weight:600;color:var(--forest);background:var(--gold-dim);
    padding:2px 7px;border-radius:10px;display:inline-block;width:fit-content;
  }
  .item-desc{color:var(--ink);}
  .item-desc .cat-note{display:block;font-size:11px;color:var(--muted);}
  .item-amt{font-family:'Source Serif 4',serif;font-size:15px;text-align:right;}
  .item-amt.income{color:var(--green-pos);}
  .item-due{color:var(--muted);font-size:13px;}
  .post-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .post-check input{width:15px;height:15px;accent-color:var(--forest);}
  .row-del{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;}
  .row-del:hover{color:var(--red);}
  .empty-note{color:var(--muted);font-size:13px;padding:14px 6px;}

  /* ---------- Calendar view ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px;letter-spacing:.03em;}
  .cal-cell{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    min-height:92px;padding:7px 8px;position:relative;
  }
  .cal-cell.blank{background:transparent;border:none;}
  .cal-daynum{font-family:'Source Serif 4',serif;font-size:14px;color:var(--ink);}
  .cal-daynum.today{color:var(--forest);font-weight:700;text-decoration:underline;}
  .cal-out{font-size:12px;color:var(--red);margin-top:6px;}
  .cal-left{font-size:12px;color:var(--muted);margin-top:2px;}
  .cal-left b{color:var(--ink);}

  /* ---------- Modal ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(32,36,31,0.45);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border-radius:var(--radius);
    width:100%;max-width:420px;padding:28px;
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{font-size:19px;margin-bottom:18px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

  .fab{
    position:fixed;bottom:30px;right:40px;
    background:var(--forest);color:#fff;border:none;border-radius:30px;
    padding:13px 22px;font-size:14px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .fab:hover{background:var(--forest-dim);}

  @media (max-width:800px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;}
    .brand-sub{display:none;}
    .nav{display:flex;gap:4px;}
    .sidebar-foot{margin-top:0;margin-left:auto;border:none;padding:0;}
    .userline{display:none;}
    .main{padding:20px 16px 80px;}
    .summary-row{grid-template-columns:1fr 1fr;}
    .item-row{grid-template-columns:1fr;gap:4px;padding:12px 4px;}
    .item-row .post-check{justify-content:flex-start;}
    .cal-grid{grid-template-columns:repeat(7,1fr);}
    .cal-cell{min-height:64px;font-size:11px;padding:5px 4px;}
    .cal-out,.cal-left{font-size:10px;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-card">
    <div class="mark">LEDGER</div>
    <h1 id="authTitle">Sign in</h1>
    <p class="sub" id="authSub">Track the family's money, together.</p>
    <div class="auth-error" id="authError"></div>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="authPass">Password</label>
        <input type="password" id="authPass" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmitBtn">Sign in</button>
    </form>
    <div class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <button class="btn-text" id="authToggleBtn" type="button">Create one</button>
    </div>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="appScreen">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">Ledger</div>
      <div class="brand-sub">Family Budget</div>
      <div class="nav">
        <button class="nav-item active" data-view="list">☰ &nbsp;List view</button>
        <button class="nav-item" data-view="calendar">▦ &nbsp;Calendar view</button>
      </div>
      <div class="sidebar-foot">
        <div class="userline" id="userEmailLabel"></div>
        <button class="signout" id="signOutBtn">Sign out</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="month-switch">
          <button id="prevMonth">‹</button>
          <div class="month-label" id="monthLabel">—</div>
          <button id="nextMonth">›</button>
        </div>
      </div>

      <div class="summary-row">
        <div class="sum-card pos"><div class="lbl">Income this month</div><div class="val" id="sumIncome">$0</div></div>
        <div class="sum-card neg"><div class="lbl">Going out this month</div><div class="val" id="sumOut">$0</div></div>
        <div class="sum-card" id="sumNetCard"><div class="lbl">Net remaining</div><div class="val" id="sumNet">$0</div></div>
        <div class="sum-card"><div class="lbl">Items unverified</div><div class="val" id="sumUnverified">0</div></div>
      </div>

      <!-- LIST VIEW -->
      <div id="listView"></div>

      <!-- CALENDAR VIEW -->
      <div id="calendarView" style="display:none;">
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>

  <button class="fab" id="openAddModal">+ Add item</button>
</div>

<!-- ================= ADD / EDIT MODAL ================= -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add budget item</h2>
    <div class="auth-error" id="itemError"></div>
    <form id="itemForm">
      <div class="field">
        <label for="itemCategory">Category</label>
        <select id="itemCategory" required>
          <option value="income">Income</option>
          <option value="subscription">Subscription</option>
          <option value="monthly_bill">Monthly bill</option>
          <option value="pay_in_4">Pay in 4</option>
          <option value="one_time">One-time payment</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="itemPerson">Who is it for</label>
          <input type="text" id="itemPerson" list="peopleList" placeholder="e.g. Sam" required>
          <datalist id="peopleList"></datalist>
        </div>
        <div class="field">
          <label for="itemAmount">Amount ($)</label>
          <input type="number" id="itemAmount" step="0.01" min="0" required>
        </div>
      </div>
      <div class="field">
        <label for="itemDesc">Description</label>
        <input type="text" id="itemDesc" placeholder="e.g. Netflix, Electric bill, Paycheck">
      </div>
      <div class="field">
        <label for="itemDue">Due date</label>
        <input type="date" id="itemDue" required>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);">
          <input type="checkbox" id="itemPosted" style="width:16px;height:16px;accent-color:var(--forest);">
          Verified as posted
        </label>
      </div>
      <input type="hidden" id="itemId">
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelItemBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveItemBtn" style="width:auto;">Save item</button>
      </div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pdlnkoqxkjdbwaasyxhx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wRn4biecUn0yP3YIqYdUeQ_KFWsrHe5';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_LABELS = {
  income: 'Income',
  subscription: 'Subscriptions',
  monthly_bill: 'Monthly Bills',
  pay_in_4: 'Pay in 4',
  one_time: 'One-Time Payments'
};
const CATEGORY_ORDER = ['income','subscription','monthly_bill','pay_in_4','one_time'];

let currentUser = null;
let currentDate = new Date();
currentDate.setDate(1);
let items = [];
let currentView = 'list';
let isSignUpMode = false;

const $ = (id) => document.getElementById(id);
const fmtMoney = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// ---------------- AUTH ----------------
$('authToggleBtn').addEventListener('click', () => {
  isSignUpMode = !isSignUpMode;
  $('authTitle').textContent = isSignUpMode ? 'Create account' : 'Sign in';
  $('authSubmitBtn').textContent = isSignUpMode ? 'Create account' : 'Sign in';
  $('authToggleText').textContent = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
  $('authToggleBtn').textContent = isSignUpMode ? 'Sign in' : 'Create one';
  $('authError').style.display = 'none';
});

$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('authEmail').value.trim();
  const password = $('authPass').value;
  $('authError').style.display = 'none';
  $('authSubmitBtn').textContent = 'Working…';
  try {
    let result;
    if (isSignUpMode) {
      result = await sb.auth.signUp({ email, password });
      if (!result.error && result.data.user && !result.data.session) {
        showAuthError('Account created. Check your email to confirm, then sign in.', false);
        isSignUpMode = false;
        $('authTitle').textContent = 'Sign in';
        $('authSubmitBtn').textContent = 'Sign in';
        return;
      }
    } else {
      result = await sb.auth.signInWithPassword({ email, password });
    }
    if (result.error) throw result.error;
    if (result.data.session) await onAuthed(result.data.session.user);
  } catch (err) {
    showAuthError(err.message || 'Something went wrong.', true);
  } finally {
    $('authSubmitBtn').textContent = isSignUpMode ? 'Create account' : 'Sign in';
  }
});

function showAuthError(msg, isError) {
  const el = $('authError');
  el.textContent = msg;
  el.style.background = isError ? 'var(--red-dim)' : 'var(--gold-dim)';
  el.style.color = isError ? 'var(--red)' : 'var(--forest)';
  el.style.display = 'block';
}

$('signOutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  currentUser = null;
  items = [];
  $('appScreen').style.display = 'none';
  $('authScreen').style.display = 'flex';
});

async function onAuthed(user) {
  currentUser = user;
  $('userEmailLabel').textContent = user.email;
  $('authScreen').style.display = 'none';
  $('appScreen').style.display = 'block';
  await loadItems();
  render();
}

// try to resume session on load
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) await onAuthed(data.session.user);
})();

// ---------------- DATA ----------------
async function loadItems() {
  const { data, error } = await sb
    .from('budget_items')
    .select('*')
    .order('due_date', { ascending: true });
  if (error) {
    console.error(error);
    alert('Could not load budget items: ' + error.message);
    return;
  }
  items = data || [];
  refreshPeopleList();
}

function refreshPeopleList() {
  const names = [...new Set(items.map(i => i.person).filter(Boolean))];
  $('peopleList').innerHTML = names.map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- NAV ----------------
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    $('listView').style.display = currentView === 'list' ? 'block' : 'none';
    $('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
    render();
  });
});

$('prevMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); render(); });
$('nextMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); render(); });

// ---------------- MODAL ----------------
function openModal(editItem) {
  $('itemError').style.display = 'none';
  if (editItem) {
    $('modalTitle').textContent = 'Edit budget item';
    $('itemId').value = editItem.id;
    $('itemCategory').value = editItem.category;
    $('itemPerson').value = editItem.person;
    $('itemAmount').value = editItem.amount;
    $('itemDesc').value = editItem.description || '';
    $('itemDue').value = editItem.due_date;
    $('itemPosted').checked = !!editItem.posted;
  } else {
    $('modalTitle').textContent = 'Add budget item';
    $('itemForm').reset();
    $('itemId').value = '';
    const d = new Date(currentDate);
    $('itemDue').value = d.toISOString().slice(0,10);
  }
  $('itemOverlay').style.display = 'flex';
}
function closeModal() { $('itemOverlay').style.display = 'none'; }

$('openAddModal').addEventListener('click', () => openModal(null));
$('cancelItemBtn').addEventListener('click', closeModal);
$('itemOverlay').addEventListener('click', (e) => { if (e.target === $('itemOverlay')) closeModal(); });

$('itemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('itemId').value;
  const payload = {
    category: $('itemCategory').value,
    person: $('itemPerson').value.trim(),
    amount: parseFloat($('itemAmount').value),
    description: $('itemDesc').value.trim(),
    due_date: $('itemDue').value,
    posted: $('itemPosted').checked,
    posted_at: $('itemPosted').checked ? new Date().toISOString() : null,
    user_id: currentUser.id
  };
  $('saveItemBtn').textContent = 'Saving…';
  try {
    let error;
    if (id) {
      ({ error } = await sb.from('budget_items').update(payload).eq('id', id));
    } else {
      ({ error } = await sb.from('budget_items').insert(payload));
    }
    if (error) throw error;
    closeModal();
    await loadItems();
    render();
  } catch (err) {
    $('itemError').textContent = err.message || 'Could not save item.';
    $('itemError').style.display = 'block';
  } finally {
    $('saveItemBtn').textContent = 'Save item';
  }
});

async function deleteItem(id) {
  if (!confirm('Remove this item?')) return;
  const { error } = await sb.from('budget_items').delete().eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  await loadItems();
  render();
}

async function togglePosted(id, checked) {
  const { error } = await sb.from('budget_items')
    .update({ posted: checked, posted_at: checked ? new Date().toISOString() : null })
    .eq('id', id);
  if (error) { alert('Could not update: ' + error.message); return; }
  await loadItems();
  render();
}

// ---------------- RENDER ----------------
function monthItems() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  return items.filter(i => {
    const d = new Date(i.due_date + 'T00:00:00');
    return d.getFullYear() === y && d.getMonth() === m;
  });
}

function render() {
  $('monthLabel').textContent = currentDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const mi = monthItems();

  const income = mi.filter(i => i.category === 'income').reduce((s,i) => s + Number(i.amount), 0);
  const out = mi.filter(i => i.category !== 'income').reduce((s,i) => s + Number(i.amount), 0);
  const unverified = mi.filter(i => !i.posted).length;

  $('sumIncome').textContent = fmtMoney(income);
  $('sumOut').textContent = fmtMoney(out);
  $('sumNet').textContent = fmtMoney(income - out);
  $('sumNetCard').className = 'sum-card ' + (income - out >= 0 ? 'pos' : 'neg');
  $('sumUnverified').textContent = unverified;

  if (currentView === 'list') renderList(mi);
  else renderCalendar(mi);
}

function renderList(mi) {
  const wrap = $('listView');
  wrap.innerHTML = '';
  CATEGORY_ORDER.forEach(cat => {
    const catItems = mi.filter(i => i.category === cat).sort((a,b) => a.due_date.localeCompare(b.due_date));
    const total = catItems.reduce((s,i) => s + Number(i.amount), 0);
    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `
      <div class="section-head">
        <h3>${CATEGORY_LABELS[cat]}</h3>
        <span class="sec-total">${fmtMoney(total)}</span>
      </div>
      <div class="section-rows"></div>
    `;
    const rowsEl = block.querySelector('.section-rows');
    if (catItems.length === 0) {
      rowsEl.innerHTML = `<div class="empty-note">Nothing here yet.</div>`;
    } else {
      catItems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const dueDate = new Date(item.due_date + 'T00:00:00');
        row.innerHTML = `
          <input type="checkbox" class="post-toggle" ${item.posted ? 'checked' : ''} title="Mark posted">
          <div class="item-desc">${escapeHtml(item.description || CATEGORY_LABELS[cat])}
            <span class="cat-note">${escapeHtml(item.person)}</span>
          </div>
          <span class="who-tag">${escapeHtml(item.person)}</span>
          <div class="item-amt ${cat === 'income' ? 'income' : ''}">${cat === 'income' ? '+' : '-'}${fmtMoney(Math.abs(item.amount))}</div>
          <div class="item-due">${dueDate.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
          <div class="post-check">${item.posted ? 'Posted' : 'Pending'}</div>
          <button class="row-del" title="Delete">✕</button>
        `;
        row.querySelector('.post-toggle').addEventListener('change', (e) => togglePosted(item.id, e.target.checked));
        row.querySelector('.row-del').addEventListener('click', () => deleteItem(item.id));
        row.querySelector('.item-desc').addEventListener('click', () => openModal(item));
        row.querySelector('.who-tag').addEventListener('click', () => openModal(item));
        rowsEl.appendChild(row);
      });
    }
    wrap.appendChild(block);
  });
}

function renderCalendar(mi) {
  const grid = $('calGrid');
  grid.innerHTML = '';
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  const monthIncome = mi.filter(i => i.category === 'income').reduce((s,i) => s + Number(i.amount), 0);

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell blank';
    grid.appendChild(blank);
  }

  let cumulativeOut = 0;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = new Date(y, m, day).toISOString().slice(0,10);
    const dayOut = mi.filter(i => i.category !== 'income' && i.due_date === dateStr)
                      .reduce((s,i) => s + Number(i.amount), 0);
    cumulativeOut += dayOut;
    const remaining = monthIncome - cumulativeOut;

    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === day;
    cell.innerHTML = `
      <div class="cal-daynum ${isToday ? 'today' : ''}">${day}</div>
      ${dayOut > 0 ? `<div class="cal-out">-${fmtMoney(dayOut)}</div>` : ''}
      <div class="cal-left">left: <b>${fmtMoney(remaining)}</b></div>
    `;
    grid.appendChild(cell);
  }
}
</script>
